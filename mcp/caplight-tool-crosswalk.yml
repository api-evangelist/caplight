divergence_note: >-
  Comps and the composite-index family (added to the REST API in the July 2026 Comps release) and the
  news and stock-split operations have no counterpart in Caplight's published MCP capability list. That
  is a real surface divergence: the REST API is currently the broader surface. Whether the 15 live tools
  cover them cannot be confirmed without an authenticated tools/list.

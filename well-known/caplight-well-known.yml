notes: >-
  Caplight publishes no security.txt, no api-catalog, no OpenID Connect discovery document and no A2A
  agent card on any host. The only well-known surface is the OAuth 2.1 discovery pair that backs the
  hosted MCP server, which is fully anonymous and complete: authorization-server metadata (RFC 8414) and
  protected-resource metadata (RFC 9728) at both the root and the /mcp sub-path.

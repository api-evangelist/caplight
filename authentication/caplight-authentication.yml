  oauth2_flows:
  - authorizationCode
  notes: >-
    Two independent auth models across two surfaces. The REST API uses a static api_key request header
    (no OAuth, no scopes). The hosted MCP server uses OAuth 2.1 authorization code + PKCE with dynamic
    client registration, and explicitly requires no API key — a Caplight account is the credential.

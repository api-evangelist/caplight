authorization:
  model: per-account entitlements
  description: >-
    Beyond authentication, v2 company-scoped endpoints enforce per-account access control documented in
    the OpenAPI description: an optional whitelist of permitted companies, an optional annual cap on
    distinct companies accessed (repeat access to the same company counts once), and field-level
    restrictions. When a field is restricted it is omitted from the response and named in the
    restricted.fields array on the funding round object. Restricted fields may include amounts,
    valuation, pps, participants and citations.
  error_codes:
  - status: 401
    meaning: Missing or invalid API key
  - status: 403
    meaning: >-
      Account does not have Companies V2 API access, or the company is outside the whitelist / over the
      annual cap

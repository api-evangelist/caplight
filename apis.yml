- name: Caplight MCP Server
  description: >-
    Hosted, remote MCP server that connects Claude.ai and Claude Desktop to the Caplight dataset. Caplight
    documents 15 tools spanning live MarketPrice quotes and price history, the secondary order book and
    trade history, company profiles, COI filings, SEC-derived fund marks, funding rounds with amounts and
    valuations, investor participation and quarterly market summaries. Added as a custom connector; no API
    key is required — access is authorized with a Caplight account over OAuth 2.1 (authorization code +
    PKCE S256, dynamic client registration), advertised via RFC 8414 and RFC 9728 metadata documents.
  humanURL: https://www.caplight.com/products/mcp
  baseURL: https://platform.caplight.com/mcp

aid: caplight
name: Caplight
description: >-
  Caplight Technologies is a San Francisco private-markets data and trading platform for institutional
  investors, covering 50,000+ VC-backed private companies with secondary-market pricing, a live
  institutional order book, trade and order history, funding rounds with valuations and participants,
  investor participation, SEC-derived fund marks, COI filings, stock splits, news, company signals and
  comparable-company indices. Its proprietary MarketPrice(TM) estimate is implied from live bids, asks
  and closed secondary trades. Caplight exposes the dataset through a versioned REST API (v1 and v2,
  api_key header auth, documented with a public OpenAPI 3.1.0 definition rendered in Redoc), a hosted
  OAuth-protected MCP server for Claude, and a one-line embeddable widget. Securities are offered
  through Caplight Markets LLC, member FINRA/SIPC.

apis:
- name: Caplight REST API
  description: >-
    Versioned REST API over the Caplight private-markets dataset. v1 covers company lookup, MarketPrice
    and MarketPrice history, the live order book, trade history, order history, quarterly market
    summaries, fund marks, news, stock splits, COI filings and comparable performance; v2 covers company
    lookup and details, funding rounds and a funding-round updates feed, investor participation, comps
    and composite-index timeseries. 26 read-only GET operations, api_key header authentication, page-based
    pagination, and a separate staging/sandbox host. Sold as a paid add-on to Caplight Data.
  humanURL: https://platform.caplight.com/api/documentation.html
  baseURL: https://us-central1-caplight-prod.cloudfunctions.net/api/public
  tags:
